# Project skill routes (project-owned). The core routes live in scripts/harness/routing.core.conf.
#
#   <path regex> | <skill>[, <skill>...] | <why>
#
# Before an agent edits a file whose repo-relative path matches, it must have loaded every listed
# skill in the current session. Stack packs adopted from the stack ADR add their routes here as marked
# blocks (harness.py adopt). Add your own routes for project skills below, for example:
# ^backbone/adr/ | <language-skill> | ADRs must respect the language's idioms.
# (?i)/(api|rest|web)/ | api-design, openapi | Outer API layer.
# /domain/ | architecture | Domain layer boundaries.
