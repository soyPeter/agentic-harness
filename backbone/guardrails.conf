# Project guardrail rules (project-owned). The core rules live in scripts/harness/guardrails.core.conf.
#
#   <block|warn> | <path regex, or @bash for shell commands> | <content regex> | <message>
#
# Fields are separated by " | ". Regexes are Python syntax and match per line. Only added text is checked.
# Turn each NEVER DO item in 4-KNOWLEDGE.md that a regex can detect into a block rule.
#
# Stack packs adopted from the stack ADR add their rules here as marked blocks (harness.py adopt).

# ADR-002: the engine stays on the standard library.
block | ^payload/owned/scripts/harness/lib/.*\.py$ | ^(?:import|from)\s+(?:pip|requests|numpy|pandas|httpx|aiohttp|flask|django|fastapi)\b | The harness engine is Python 3.8+ and the standard library only (ADR-002).
#
# Examples (remove the leading "# " to enable):
# block | /domain/ | ^(import|from) .*\b(infra|infrastructure)\b | Domain must not depend on infrastructure.
# warn  | \.(ts|tsx)$ | console\.log\( | Use the logger instead of console.log.
# block | @bash | \bnpm\s+publish\b | Publishing is done by CI only.
