# Tool contracts: what each tool may do, so the harness gates every tool that can change something.
# Only the user edits this file; agents are refused, and so are commits that change it (verify).
#
#   <tool or pattern>...  <class>  [path=<input field>[,<field>]]  [confirm]
#
# class    read      looks only: runs with no checks
#          write     changes files: path= names the input field(s) holding the path, and those paths get the same
#                    gates as Write and Edit (no harness files; role, orchestrator and skill scopes). Without path=
#                    the harness can't see which files it writes, so autonomous mode refuses it
#          exec      runs commands or processes
#          network   reaches the network
#          agent     starts another agent (whose own tool calls are gated)
# confirm  needs the user: refused in autonomous mode; in supervised mode Claude Code asks for permission
#
# Patterns are shell-style (mcp__github__* matches every tool of the github MCP server). The agents' own tools
# (Write, Edit, Bash, NotebookEdit, WebFetch, Task, ...) have built-in contracts this file can't change.
# A tool with no contract runs with a warning in supervised mode and is refused in autonomous mode;
# harness.py report lists the ones seen. Examples:
#
# mcp__filesystem__write_file   write    path=path
# mcp__filesystem__read_*       read
# mcp__github__create_pull_request   network   confirm
