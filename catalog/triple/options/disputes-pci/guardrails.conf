# Parked surfaces of the Disputes pilot: agents may not write them. The user changes them by hand, or lifts a lock
# through a later ADR that re-adopts the pack without this option. Only added lines are checked, so the "." content
# regex refuses any non-empty edit; deletions are caught by HARNESS_RISK_PATHS and review.
block | (?i)(^|/)(auth|authn|authz|authentication|authorization|iam|identity|sso|oauth2?|sessions?)(/|\.[A-Za-z0-9]+$) | . | Parked in the Disputes pilot: authentication and authorization belong to security. Escalate (disputes-pci skill).
block | (?i)(^|/)(billing|payments?|payouts?|charges?|refunds?|settlements?|ledger|acquir\w*|issuer|card(s|holder)?|pan|tokeni[sz]ation|vault)(/|\.[A-Za-z0-9]+$) | . | Parked in the Disputes pilot: billing, payments and card data belong to the payments owners. Escalate (disputes-pci skill).
block | (?i)(^|/)(migrations?|migrate|db/migration|prisma/migrations|flyway|liquibase|changelogs?/db)(/|$) | . | Parked in the Disputes pilot: schema migrations need infra and a DBA. Escalate (disputes-pci skill).
block | (?i)(^|/)(pci|pci[-_]?dss|pci[-_]?evidence|compliance|audit[-_]?evidence|attestations?)(/|\.[A-Za-z0-9]+$) | . | Parked in the Disputes pilot: PCI evidence belongs to security and compliance. Escalate (disputes-pci skill).
block | (?i)(^|/)(\.env(\.[^/]*)?|secrets?(/|\.[A-Za-z0-9]+$)|[^/]*\.(pem|key|p12|pfx|jks|keystore)$) | . | Parked in the Disputes pilot: secrets and key material are never written by agents (disputes-pci skill).
block | (?i)(^|/)(terraform|infra|infrastructure|k8s|kubernetes|helm|deploy(ment)?s?)/ | . | Parked in the Disputes pilot: infrastructure belongs to infra. Escalate (disputes-pci skill).
# Card data in any file. Test fixtures use the brands' published test numbers, flagged so a human checks them.
block | .* | (?i)\b(cvv2?|cvc2?|card[_ -]?verification)\b\s*[:=]\s*["']?\d{3,4}\b | Never store a card verification value, not even in a fixture (PCI DSS 3.3.1; disputes-pci skill).
warn | .* | \b(4\d{3}|5[1-5]\d{2}|2[2-7]\d{2}|3[47]\d{2}|6011)[ -]?\d{4}[ -]?\d{4}[ -]?\d{1,4}\b | This looks like a card number (PAN). Use a token or a published brand test number, and say so in a comment (disputes-pci skill).
# Shell writes into parked paths skip the file-tool gates above.
block | @bash | (?i)(>|\btee\b|\bcp\b|\bmv\b|\bsed\s+-i\b|\brm\b)[^;&|\n]*(^|/|\s)(auth|billing|payments?|migrations?|pci[^/\s]*|secrets?|\.env)(/|\s|$) | Shell writes into parked Disputes paths are refused; they are escalated to their owners (disputes-pci skill).
block | @bash | (?i)\b(prisma\s+migrate\s+(deploy|reset)|flyway\s+(migrate|clean)|liquibase\s+update|knex\s+migrate:latest|typeorm\s+migration:run|npx\s+sequelize\S*\s+db:migrate)\b | Running migrations is parked in the Disputes pilot; infra runs them (disputes-pci skill).
