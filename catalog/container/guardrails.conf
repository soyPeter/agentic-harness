warn | (^|/)(Containerfile|Dockerfile)[^/]*$ | (?i)^\s*FROM\s+\S+:latest\b | Pin base images (a version tag, plus a digest for releases), never :latest (containers skill).
block | (^|/)(Containerfile|Dockerfile)[^/]*$ | (?i)^\s*(ENV|ARG)\s+\w*(PASSWORD|PASSWD|SECRET|TOKEN|PRIVATE_KEY|API_KEY)\w*(\s*=\s*|\s+)\S+ | Secrets in ENV/ARG are baked into the image; use build secrets (RUN --mount=type=secret) or runtime secrets (container-security skill).
block | (^|/)(Containerfile|Dockerfile)[^/]*$ | (?i)^\s*(COPY|ADD)\s.*\S*(\.key|\.p12|\.pfx|\.jks|key\.pem)\b | Never copy private keys or keystores into an image; mount them at runtime (container-security skill).
block | (^|/)(docker-|podman-)?compose[^/]*\.ya?ml$ | (docker|podman)\.sock | Never mount the container engine socket into a container (container-security skill).
warn | (^|/)(docker-|podman-)?compose[^/]*\.ya?ml$ | privileged:\s*true | Privileged containers defeat isolation; remove it or justify it in an ADR (container-security skill).
warn | (^|/)(docker-|podman-)?compose[^/]*\.ya?ml$ | network_mode:\s*["']?host | Host networking bypasses network isolation; justify it in an ADR (container-security skill).
