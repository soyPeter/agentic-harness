warn | \.java$ | \bSystem\.(out|err)\.print | Use the logger instead of System.out/System.err.
warn | \.java$ | \.printStackTrace\(\) | Log the exception with context, or rethrow it; don't print stack traces.
warn | \.java$ | catch\s*\([^)]*\)\s*\{\s*\} | Empty catch block swallows the error; handle, translate or rethrow it.
