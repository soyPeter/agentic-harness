# Agentic harness configuration (project-owned).
# KEY="value" lines, parsed (never executed) by scripts/harness/lib/harness.py.
# An environment variable with the same name overrides a value. See backbone/HOOKS.md.

HARNESS_PROJECT_NAME="{{PROJECT_NAME}}"

# The git pre-commit hook runs this to prove the code builds. Empty skips the check.
# The user skips it once with SKIP_BUILD=1. Adopting a stack pack can set it from the build tool the ADR chose.
HARNESS_BUILD_CMD=""

# The test command the implementer and judge run.
HARNESS_TEST_CMD=""

# Regex for test file paths. The judge requires each acceptance criterion id (AC-<task>-<n>) to
# appear in at least one matching file. Leave unset for the default (tests/, *_test.*, *Test.*, ...).
# HARNESS_TEST_PATHS="<regex for your test directories>"

# Conventional Commit types and the maximum subject length.
HARNESS_COMMIT_TYPES="feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert"
HARNESS_SUBJECT_MAX="72"
# Warn when a commit scope matches no path segment of the staged files (on | off); scopes that are
# cross-cutting by nature (regex) are exempt.
HARNESS_SCOPE_CHECK="on"
HARNESS_CROSS_SCOPES="deps|build|ci|docs|backbone|harness|release|config|tests?"
# With no task [WIP], nudge to commit once this many tracked files are changed (0 = off).
HARNESS_COMMIT_NUDGE="8"

# What the Stop hook does while a task is [WIP]: remind | block | off
HARNESS_STOP_MODE="remind"

# 1 allows more than one [WIP] task at a time.
HARNESS_ALLOW_PARALLEL_WIP="0"

# Gates (on | off). Only the user may change these and HARNESS_JUDGE_MAX_ROUNDS; agents' edits are refused.
# Start gate: a task becomes [WIP] only with a valid, grilled, user-approved spec.
HARNESS_SPEC_GATE="on"
# Skill gate: a file is edited only after the skills routed to it (and the spec's skills) are loaded.
HARNESS_SKILL_GATE="on"
# Judge gate: a task becomes [x] only with a judge pass on the current code.
HARNESS_JUDGE_GATE="on"
# Failed judge rounds before the agent must stop and escalate to the user.
HARNESS_JUDGE_MAX_ROUNDS="2"
# Seconds the judge's recorder lets HARNESS_TEST_CMD run when it re-runs the tests itself.
HARNESS_TEST_TIMEOUT="900"
# verify re-checks the gates on the staged state in pre-commit (block | off). User-only; the user commits a
# deliberate exception with HARNESS_VERIFY=off git commit ... CI runs: harness.py verify --range <base>..HEAD
HARNESS_VERIFY="block"
# The main session may not edit specs, ADRs or code; the role agents do (on | off). User-only.
HARNESS_ORCHESTRATOR_SCOPE="on"

# Autonomy (all user-only). supervised: the user approves specs and answers questions. autonomous: no human in
# the loop; harness.py approve approves low-risk specs by policy and everything else is escalated to
# backbone/escalations.md (AGENTS.md section 7). Kill switch: create .git/harness/STOP.
HARNESS_AUTONOMY="supervised"
# low | off: whether harness.py approve may approve low-risk specs.
HARNESS_AUTO_APPROVE="low"
# A policy-approved change touching more files than this is escalated.
HARNESS_RISK_MAX_FILES="20"
# Griller fails before an autonomous escalation (the judge uses HARNESS_JUDGE_MAX_ROUNDS).
HARNESS_GRILL_MAX_ROUNDS="3"
# on: escalations also open a GitHub issue with gh.
HARNESS_ESCALATE_GH="off"
# harness.py run (user-only): the agent command (prompt on stdin), seconds per session, sessions per task.
# Unattended agents need pre-approved tools: allow build/test commands in .claude/settings.json, or run in a
# container/VM with --dangerously-skip-permissions (the harness hooks apply either way).
# Codex: codex exec --json -s workspace-write --dangerously-bypass-hook-trust   (sandbox it; see backbone/HOOKS.md)
# OpenCode: opencode run --format json --auto "$(cat)"
HARNESS_AGENT_CMD="claude -p --permission-mode acceptEdits --output-format json"
HARNESS_RUN_TASK_TIMEOUT="3600"
HARNESS_RUN_ATTEMPTS="2"
# Dollars per run (read from --output-format json); empty = no limit. Per session: --max-budget-usd in the command.
HARNESS_RUN_MAX_COST=""
# Sandbox backend the runner starts its sessions with (user-only, ADR-003). devcontainer, the only one, runs them
# where the runner runs: inside .devcontainer/harness-agent/ when you start the run there.
HARNESS_SANDBOX_BACKEND="devcontainer"
# The sandbox each Change-Class needs (user-only, ADR-003): space-separated <class>=<isolation class> pairs, isolation
# classes none < custom < container < userspace-kernel < microVM < dedicated-VM. A pair holds for its class and the classes above
# it (docs < refactor < feature < schema). Such work starts only in a sandbox that has it, and finishes only with a judge
# pass recorded in one; verify checks the recorded one. auto: schema=container in autonomous mode, nothing in
# supervised mode. Empty: no class needs a sandbox.
HARNESS_SANDBOX_REQUIRE="auto"
# on: run on the host brings .devcontainer/harness-agent/ up with the devcontainer CLI and runs each session in it,
# stopping the containers it started afterwards (user-only, ADR-003). off: sessions run where run runs.
HARNESS_SANDBOX_START="off"
# Days after which doctor flags a skill's last-verified date (0 = off).
HARNESS_SKILL_MAX_AGE="180"
# Seconds after which a hook call is logged as slow in the event log (0 = never); harness.py report counts them.
HARNESS_HOOK_SLOW="5"
# What counts as not low-risk (regexes; defaults cover auth, secrets, payments, personal data, migrations,
# breaking/public API changes, and auth/security/migration/infra/CI/build paths). Uncomment to override.
# HARNESS_RISK_TERMS="<regex>"
# HARNESS_RISK_PATHS="<regex>"
# What counts as documentation (regex; default: files ending in .md, .mdx, .markdown, .rst, .adoc, .asciidoc or .txt,
# and README, CHANGELOG, LICENSE and the like without an extension; CMakeLists.txt and pip requirements are code). A
# folder doesn't count: docs/conf.py and MkDocs hooks are code. MDX can run JSX, and files the application reads at
# runtime may use these extensions: narrow the regex if you have them. A spec declaring Change-Class: docs whose change
# touches anything else is not low-risk. User-only.
# HARNESS_DOC_PATHS="<regex>"

# Decision layer (advisory model judgements, e.g. "does the commit message match the diff?").
# Off until a design decision says otherwise: a provider sends project data (diffs, messages) to it,
# so HARNESS_DECISION_ADR must name an Accepted ADR that mentions the provider. All keys below are
# user-only. Providers: none | command | ollama | claude | jev. Modes: off | shadow (log only) | advise (warn).
# Questions and thresholds: scripts/harness/decisions.json. Log: python3 scripts/harness/lib/harness.py decisions
HARNESS_DECISION_PROVIDER="none"
HARNESS_DECISION_MODE="off"
HARNESS_DECISION_ADR=""
# For provider "command": an executable reading {"decision","state","questions"} JSON on stdin.
HARNESS_DECISION_CMD=""
# Pin the model version (ollama defaults to nimble, claude to claude-opus-5-5; jev requires a pinned version).
HARNESS_DECISION_MODEL=""
HARNESS_DECISION_TIMEOUT="20"
# For provider "ollama": the decision endpoint (default http://localhost:11434/v1/systemone).
HARNESS_DECISION_URL=""

# Tester (user-only): the tester writes the acceptance tests before the code, in files matching
# HARNESS_ACCEPTANCE_PATHS; the implementer may not change them, and a task can't finish if they changed.
HARNESS_TESTER="off"
HARNESS_ACCEPTANCE_PATHS="(^|/)acceptance([/._-]|$)"
# Spec size (user-only): requirements plus acceptance criteria per spec (0 = no limit). Big specs don't converge:
# each grill round finds more detail to question. A spec over the limit must be cut or the task split.
HARNESS_SPEC_MAX_ITEMS="30"
# Debugger: after a judge fail, the debugger diagnoses the cause and writes a fix brief (on | off).
HARNESS_DEBUGGER="on"
# Review (user-only, on | off): after the judge passes, three reviewers check the change in parallel, one lens each
# (correctness, structure, lean). A task can't be finished, committed or pushed without a pass from every lens.
HARNESS_REVIEW="on"
# Delivery (user-only, on | off): a finished, committed task is done only once the deliverer has pushed its branch,
# opened or updated the PR and seen CI pass. It never merges. Needs an origin remote and the gh CLI.
HARNESS_DELIVER="on"
# Requirement style (user-only, plain | ears): ears makes spec-check require an EARS pattern for every requirement
# ("When <trigger>, the <system> shall ...") and lets acceptance criteria prove NFR-<task>-<n> items too.
HARNESS_REQ_STYLE="plain"
# Light lane (user-only, on | off): a task the user marks "(light)" on its line in 3-TASKS.md skips the architect and
# the griller when its spec has at most HARNESS_LIGHT_MAX_ITEMS requirements plus criteria and is low-risk. The
# approval, the judge and verify still apply; finishing refuses a light task that changed more than
# HARNESS_LIGHT_MAX_FILES files or touched sensitive paths. Only the user adds the mark.
HARNESS_LIGHT_LANE="off"
HARNESS_LIGHT_MAX_ITEMS="3"
HARNESS_LIGHT_MAX_FILES="3"

# Organisation profile (user-only): empty, or "triple" for a supervised pilot where only a human merges. Under
# "triple", harness.py orca refuses --merge and --trust, orca-nightly refuses to start, and enroll refuses
# --automation and --protect. The environment (HARNESS_PROFILE=triple, TRIPLE_MODE=1) can add the profile, never lift it.
HARNESS_PROFILE=""

# Orca coordinator (harness.py orca, user-only): the agent per role (default=...; e.g. judge=codex runs the judge on
# another model), and launch commands for agents that need flags (separated by ;).
HARNESS_ORCA_AGENTS="default=claude"
HARNESS_ORCA_LAUNCH="codex=codex --dangerously-bypass-hook-trust -c check_for_update_on_startup=false"

# Knowledge source (user-only): a folder of notes behind an MCP server registered as "knowledge"
#   claude mcp add -s local knowledge -- <the server's command>
# In autonomous mode the analyst and architect answer the griller's questions from it, citing vault:<path>;
# what it doesn't answer clearly is escalated. Agents may only use its read tools. Empty = off.
HARNESS_KNOWLEDGE_ROOT=""
# Folders (vault-relative, space-separated) agents may read and cite; empty = all. Searches aren't filtered,
# so keep notes that must not reach the model out of the folder the server serves.
HARNESS_KNOWLEDGE_PATHS=""
# Regex of the server's tool names agents may call (read-only ones). Uncomment to override the default.
# HARNESS_KNOWLEDGE_TOOLS="<regex>"
