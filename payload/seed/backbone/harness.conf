# Agentic harness configuration (project-owned).
# KEY="value" lines, parsed (never executed) by scripts/harness/lib/harness.py.
# An environment variable with the same name overrides a value. See backbone/HOOKS.md.

HARNESS_PROJECT_NAME="{{PROJECT_NAME}}"

# The git pre-commit hook runs this to prove the code builds. Empty skips the check.
# Skip once with SKIP_BUILD=1. Adopting a stack pack can set it from the build tool the ADR chose.
HARNESS_BUILD_CMD=""

# The test command the implementer and judge run.
HARNESS_TEST_CMD=""

# Regex for test file paths. The judge requires each acceptance criterion id (AC-<task>-<n>) to
# appear in at least one matching file. Leave unset for the default (tests/, *_test.*, *Test.*, ...).
# HARNESS_TEST_PATHS="<regex for your test directories>"

# Conventional Commit types and the maximum subject length.
HARNESS_COMMIT_TYPES="feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert"
HARNESS_SUBJECT_MAX="72"
# Warn when a commit scope matches no path segment of the staged files (on | off); scopes that are
# cross-cutting by nature (regex) are exempt.
HARNESS_SCOPE_CHECK="on"
HARNESS_CROSS_SCOPES="deps|build|ci|docs|backbone|harness|release|config|tests?"
# With no task [WIP], nudge to commit once this many tracked files are changed (0 = off).
HARNESS_COMMIT_NUDGE="8"

# What the Stop hook does while a task is [WIP]: remind | block | off
HARNESS_STOP_MODE="remind"

# 1 allows more than one [WIP] task at a time.
HARNESS_ALLOW_PARALLEL_WIP="0"

# Gates (on | off). Only the user may change these and HARNESS_JUDGE_MAX_ROUNDS; agents' edits are refused.
# Start gate: a task becomes [WIP] only with a valid, grilled, user-approved spec.
HARNESS_SPEC_GATE="on"
# Skill gate: a file is edited only after the skills routed to it (and the spec's skills) are loaded.
HARNESS_SKILL_GATE="on"
# Judge gate: a task becomes [x] only with a judge pass on the current code.
HARNESS_JUDGE_GATE="on"
# Failed judge rounds before the agent must stop and escalate to the user.
HARNESS_JUDGE_MAX_ROUNDS="2"

# Decision layer (advisory model judgements, e.g. "does the commit message match the diff?").
# Off until a design decision says otherwise: a provider sends project data (diffs, messages) to it,
# so HARNESS_DECISION_ADR must name an Accepted ADR that mentions the provider. All keys below are
# user-only. Providers: none | command | ollama | claude | jev. Modes: off | shadow (log only) | advise (warn).
# Questions and thresholds: scripts/harness/decisions.json. Log: python3 scripts/harness/lib/harness.py decisions
HARNESS_DECISION_PROVIDER="none"
HARNESS_DECISION_MODE="off"
HARNESS_DECISION_ADR=""
# For provider "command": an executable reading {"decision","state","questions"} JSON on stdin.
HARNESS_DECISION_CMD=""
# Pin the model version (ollama defaults to nimble, claude to claude-opus-5-5; jev requires a pinned version).
HARNESS_DECISION_MODEL=""
HARNESS_DECISION_TIMEOUT="20"
# For provider "ollama": the decision endpoint (default http://localhost:11434/v1/systemone).
HARNESS_DECISION_URL=""
