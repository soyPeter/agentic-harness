# Agentic harness: the sandbox's two containers (harness-owned; devcontainer.json starts them).
# The egress container applies the outbound allowlist (init-firewall.sh) in the network namespace the agent's container
# joins. The agent can't change those rules: it holds neither NET_ADMIN nor NET_RAW, has no sudo, and shares neither
# processes nor files with the egress container. If the egress container stops, the agent loses its network.
services:
  egress:
    build: .
    user: root
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      # Extra hosts the build and tests need (space-separated), e.g. "repo.maven.apache.org pypi.org".
      HARNESS_FIREWALL_ALLOW: ""
    volumes:
      - egress-allowlist:/run/harness-egress
    command: ["sh", "-c", "/usr/local/bin/init-firewall.sh && exec sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "iptables -S OUTPUT | grep -qx -- '-P OUTPUT DROP' && test -s /run/harness-egress/allowlist"]
      interval: 2s
      timeout: 5s
      retries: 60

  agent:
    build: .
    network_mode: service:egress
    depends_on:
      egress:
        condition: service_healthy
    cap_drop: [NET_ADMIN, NET_RAW]
    security_opt: ["no-new-privileges:true"]
    environment:
      HARNESS_AGENT_CMD: claude -p --dangerously-skip-permissions --output-format json
      HARNESS_EGRESS_ALLOWLIST: /run/harness-egress/allowlist
    volumes:
      - ../..:/workspace:cached
      - claude-config:/home/agent/.claude
      - egress-allowlist:/run/harness-egress:ro
    command: ["sleep", "infinity"]

volumes:
  egress-allowlist:
  # One login volume for every project's sandbox, as before this file existed.
  claude-config:
    name: harness-agent-claude-config
