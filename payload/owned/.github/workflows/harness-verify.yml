# Harness-owned (agentic harness). The authoritative copy of the harness gates: it re-checks every pull
# request with `harness.py verify --range`, using the BASE branch's harness, so a pull request cannot change
# the verifier that checks it. Make this check required in the branch protection of your default branch.
#
# Changes to the harness itself or to user-only settings fail the check unless a maintainer adds the
# `harness-change-approved` label (restrict who may label pull requests accordingly).
name: harness-verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Take the verifier from the base branch
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -o pipefail
          assets=(scripts/harness/lib scripts/harness/guardrails.core.conf
                  scripts/harness/routing.core.conf scripts/harness/decisions.json)
          if ! git rev-parse --verify "origin/$BASE^{commit}" >/dev/null; then
            echo "::error::Cannot resolve the base branch origin/$BASE."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/trusted"
          if git cat-file -e "origin/$BASE:scripts/harness/lib" 2>/dev/null; then
            if ! git archive "origin/$BASE" "${assets[@]}" | tar -x -C "$RUNNER_TEMP/trusted"; then
              echo "::error::Cannot extract the base branch's verifier and required engine configuration."
              exit 1
            fi
            echo "Using the harness from origin/$BASE."
          else
            echo "::warning::origin/$BASE has no harness yet; using the pull request's copy."
            rm -rf "$RUNNER_TEMP/trusted"
            mkdir -p "$RUNNER_TEMP/trusted/scripts/harness"
            cp -R "${assets[@]}" "$RUNNER_TEMP/trusted/scripts/harness/"
          fi

      - name: Verify the pull request's commits
        env:
          BASE: ${{ github.base_ref }}
          HARNESS_ROOT: ${{ github.workspace }}
          ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'harness-change-approved') && '--allow-user-changes' || '' }}
        run: python3 "$RUNNER_TEMP/trusted/scripts/harness/lib/harness.py" verify --range "origin/$BASE..HEAD" $ALLOW
