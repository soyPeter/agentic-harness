# Core guardrail rules (harness-owned; replaced on update).
# Project rules belong in backbone/guardrails.conf, which uses the same format:
#
#   <block|warn> | <path regex, or @bash for shell commands> | <content regex> | <message>
#
# Fields are separated by " | " (space, pipe, space). Regexes are Python syntax.
# block: Claude Code hooks refuse the command or edit, and git pre-commit refuses the commit.
# warn:  reported to the agent after the edit and printed by pre-commit; never blocks.

# Destructive shell commands. The user can still run them themselves.
block | @bash | \bgit\s+reset\s+--hard\b | git reset --hard discards uncommitted work permanently; prefer git stash.
block | @bash | \bgit\s+clean\s+-[A-Za-z]*f | git clean -f deletes untracked files permanently.
block | @bash | \bgit\s+push\b[^;&|\n]*\s(--force(?!-with-lease)\b|-f\b) | Force push rewrites remote history; use --force-with-lease, and only after asking the user.
block | @bash | \bgit\b[^;&|\n]*\s--no-verify\b | --no-verify skips the harness git hooks; fix what the hook reports instead.
block | @bash | \brm\s+(-[A-Za-z]+\s+)*-[A-Za-z]*[rR][A-Za-z]*\s+(-[A-Za-z]+\s+)*["']?(/|~|\$HOME|\.|\.\.|\*)/?["']?(\s|$|;|&) | Recursive delete of the filesystem root, home or whole working directory.
block | @bash | (?i)\bdrop\s+(database|schema|table)\b | Dropping a database object destroys its data.
block | @bash | (?i)\btruncate\s+table\b | TRUNCATE TABLE deletes every row with no rollback.

# Risky but sometimes legitimate shell commands: reported to the agent after they run.
warn | @bash | \bgit\s+(checkout\s+(\S+\s+)?--\s|restore\s) | That discarded uncommitted changes in the named files; make sure that was intended.
warn | @bash | \bgit\s+stash\s+(drop|clear)\b | Stash entries are gone for good; confirm nothing was needed.
warn | @bash | \bgit\s+branch\s+-D\b | A forced branch delete loses unmerged commits; confirm they were merged or unneeded.
warn | @bash | \bgit\s+tag\s+-d\b | A deleted tag may still exist on the remote; keep them in sync deliberately.
warn | @bash | \bgit\b[^;&|\n]*\bcommit\b[^;&|\n]*--amend\b | Amending rewrites the last commit; never amend a commit that was already pushed.

# Judge verdicts are written only by the judge agent's hook (file edits are refused separately).
block | @bash | (>|\btee\b|\bcp\b|\bmv\b|\brm\b|\bsed\s+-i\b|\bln\b)[^;&|\n]*backbone/\.verdicts\b | Judge verdicts are recorded only by the judge agent's hook; run the judge agent instead.

# Secrets.
block | .* | -----BEGIN ([A-Z]+ )?PRIVATE KEY----- | Private keys must never be written into the repository.
block | .* | \bAKIA[0-9A-Z]{16}\b | This looks like an AWS access key id; read secrets from the environment or a secret manager.
