# Core skill routes (harness-owned; replaced on update).
# Project routes belong in backbone/routing.conf, which uses the same format:
#
#   <path regex> | <skill>[, <skill>...] | <why>
#
# Before an agent edits a file whose repo-relative path matches, it must have loaded every listed
# skill in the current session (read .claude/skills/<skill>/SKILL.md or invoke the skill).
# Skills that do not exist yet are ignored by the gate and reported by doctor.sh.

^backbone/specs/[^/]+\.md$ | requirements-writing | Specs hold requirements and acceptance criteria.
^backbone/adr/[^/]+\.md$ | adr-writing, architecture | ADRs record architecture decisions.
(?i)(^|/)(openapi|swagger)[^/]*\.(ya?ml|json)$ | openapi, api-design | API contracts.
\.(java|kt|scala|groovy|py|ts|tsx|js|jsx|mjs|cjs|go|rs|cs|rb|php|swift|c|cc|cpp|h|hpp)$ | code-quality | Source code.
(^|/)(tests?|__tests__|spec|src/test|src/integrationTest)/|(^|/)test_[^/]*\.py$|[._-](test|spec)\.[A-Za-z0-9]+$|(Test|Tests|IT)\.(java|kt|scala|groovy|cs)$ | module-testing | Tests.
