<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1268" width="1760" height="1268" role="img" aria-labelledby="t d">
<title id="t">What the harness can prove about a change</title>
<desc id="d">One task's evidence chain from spec to receipt, tied together by a spec fingerprint and a code fingerprint; the places it is checked again outside the agent's session; and the proposed exports that carry it out of the repository.</desc>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0.12em; fill: #262523; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #262523; }
  .h1 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 30px; fill: #262523; }
  .stage { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 31px; fill: #262523; }
  .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; letter-spacing: 0.08em; fill: #E2602A; }
  .ref { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; letter-spacing: 0.08em; fill: #5F5B55; }
  .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; letter-spacing: 0.14em; fill: #262523; }
  .chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; letter-spacing: 0.12em; fill: #262523; }
  .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; letter-spacing: 0.1em; fill: #5F5B55; }
  .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 25px; fill: #262523; }
  .title-s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; fill: #262523; }
  .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; fill: #5F5B55; }
  .item { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 19px; fill: #262523; }
  .note { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 17px; fill: #5F5B55; }
  .gov { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; fill: #262523; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; letter-spacing: 0; fill: #262523; }
  .msg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; fill: #262523; }
  .msg-s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; fill: #5F5B55; }
  .code-s { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; letter-spacing: 0; fill: #262523; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#46443F"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#E2602A"/></marker><marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8C8880"/></marker></defs>
<rect x="0" y="0" width="1760" height="1268" rx="3" fill="#F1EFEA" stroke="none" stroke-width="1.5"/>
<text x="48" y="76" class="h1">What the harness can prove about a change</text>
<text x="1712" y="72" class="tiny" text-anchor="end">HOOKS.MD · CHANGE RECEIPT · ADR-003, ADR-004, ADR-005</text>
<line x1="40" y1="104" x2="1720" y2="104" stroke="#CFCBC3" stroke-width="1.5"/>
<text x="48" y="152" class="label">ONE TASK'S CHAIN · IN BACKBONE/ AND GIT</text>
<rect x="48" y="250" width="214" height="268" rx="3" fill="#EFEDE8" stroke="#A9A49B" stroke-width="1.5"/>
<text x="68" y="280" class="tiny">SPECS/&lt;ID&gt;.MD</text>
<text x="68" y="314" class="title-s"><tspan x="68" dy="0">Spec</tspan></text>
<text x="68" y="346" class="body"><tspan x="68" dy="0">REQ and</tspan><tspan x="68" dy="23">Given/When/Then AC</tspan><tspan x="68" dy="23">ids, NFRs, the</tspan><tspan x="68" dy="23">Change-Class and the</tspan><tspan x="68" dy="23">ADRs it follows.</tspan></text>
<line x1="264" y1="384.0" x2="284" y2="384.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="288" y="250" width="214" height="268" rx="3" fill="#EFEDE8" stroke="#A9A49B" stroke-width="1.5"/>
<text x="308" y="280" class="tiny">&lt;ID&gt;.GRILL.JSON</text>
<text x="308" y="314" class="title-s"><tspan x="308" dy="0">Grill pass</tspan></text>
<text x="308" y="346" class="body"><tspan x="308" dy="0">Fingerprint: the</tspan><tspan x="308" dy="23">spec without its</tspan><tspan x="308" dy="23">Approval section,</tspan><tspan x="308" dy="23">plus every ADR it</tspan><tspan x="308" dy="23">cites.</tspan></text>
<line x1="504" y1="384.0" x2="524" y2="384.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="528" y="250" width="214" height="268" rx="3" fill="#EFEDE8" stroke="#A9A49B" stroke-width="1.5"/>
<text x="548" y="280" class="tiny">APPROVED-BY: LINE</text>
<text x="548" y="314" class="title-s"><tspan x="548" dy="0">Approval</tspan></text>
<text x="548" y="346" class="body"><tspan x="548" dy="0">A person's line, or</tspan><tspan x="548" dy="23">policy:low-risk with</tspan><tspan x="548" dy="23">the base commit and</tspan><tspan x="548" dy="23">the grill</tspan><tspan x="548" dy="23">fingerprint. The</tspan><tspan x="548" dy="23">spec freezes.</tspan></text>
<line x1="744" y1="384.0" x2="764" y2="384.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="768" y="250" width="214" height="268" rx="3" fill="#EFEDE8" stroke="#A9A49B" stroke-width="1.5"/>
<text x="788" y="280" class="tiny">&lt;ID&gt;.TESTS.JSON</text>
<text x="788" y="314" class="title-s"><tspan x="788" dy="0">Acceptance</tspan><tspan x="788" dy="27">tests</tspan></text>
<text x="788" y="373" class="body"><tspan x="788" dy="0">Optional tester:</tspan><tspan x="788" dy="23">which files prove</tspan><tspan x="788" dy="23">which AC,</tspan><tspan x="788" dy="23">fingerprinted. The</tspan><tspan x="788" dy="23">implementer can't</tspan><tspan x="788" dy="23">touch them.</tspan></text>
<line x1="984" y1="384.0" x2="1004" y2="384.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1008" y="250" width="214" height="268" rx="3" fill="#EFEDE8" stroke="#A9A49B" stroke-width="1.5"/>
<text x="1028" y="280" class="tiny">&lt;ID&gt;.JUDGE.JSON</text>
<text x="1028" y="314" class="title-s"><tspan x="1028" dy="0">Judge pass</tspan></text>
<text x="1028" y="346" class="body"><tspan x="1028" dy="0">Code fingerprint:</tspan><tspan x="1028" dy="23">the git tree without</tspan><tspan x="1028" dy="23">backbone/. The</tspan><tspan x="1028" dy="23">harness's own test</tspan><tspan x="1028" dy="23">run: exit code,</tspan><tspan x="1028" dy="23">time, output hash.</tspan></text>
<line x1="1224" y1="384.0" x2="1244" y2="384.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1248" y="250" width="214" height="268" rx="3" fill="#EFEDE8" stroke="#A9A49B" stroke-width="1.5"/>
<text x="1268" y="280" class="tiny">&lt;ID&gt;.REVIEW.JSON</text>
<text x="1268" y="314" class="title-s"><tspan x="1268" dy="0">Review passes</tspan></text>
<text x="1268" y="346" class="body"><tspan x="1268" dy="0">One per lens, on the</tspan><tspan x="1268" dy="23">same code</tspan><tspan x="1268" dy="23">fingerprint. A</tspan><tspan x="1268" dy="23">must-fix finding is</tspan><tspan x="1268" dy="23">a fail.</tspan></text>
<line x1="1464" y1="384.0" x2="1484" y2="384.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1488" y="250" width="214" height="268" rx="3" fill="#EFEDE8" stroke="#A9A49B" stroke-width="1.5"/>
<text x="1508" y="280" class="tiny">HARNESS.PY RECEIPT</text>
<text x="1508" y="314" class="title-s"><tspan x="1508" dy="0">Receipt</tspan></text>
<text x="1508" y="346" class="body"><tspan x="1508" dy="0">Built from the spec,</tspan><tspan x="1508" dy="23">the verdicts and the</tspan><tspan x="1508" dy="23">diff: what is</tspan><tspan x="1508" dy="23">verified, what is</tspan><tspan x="1508" dy="23">not, risks, labels.</tspan></text>
<path d="M54,230 L54,216 L736,216 L736,230" fill="none" stroke="#E2602A" stroke-width="1.8"/>
<rect x="300.2" y="203" width="189.6" height="26" rx="3" fill="#F1EFEA" stroke="none" stroke-width="1.5"/>
<text x="395.0" y="221" class="tiny" text-anchor="middle" fill="#E2602A">SPEC FINGERPRINT</text>
<path d="M1014,230 L1014,216 L1456,216 L1456,230" fill="none" stroke="#E2602A" stroke-width="1.8"/>
<rect x="1140.2" y="203" width="189.6" height="26" rx="3" fill="#F1EFEA" stroke="none" stroke-width="1.5"/>
<text x="1235.0" y="221" class="tiny" text-anchor="middle" fill="#E2602A">CODE FINGERPRINT</text>
<g><rect x="48" y="544" width="18" height="34" rx="2" fill="#FAF9F6" stroke="#8C8880" stroke-width="1.5"/><line x1="48" y1="556.24" x2="66" y2="556.24" stroke="#E2602A" stroke-width="2"/><line x1="48" y1="565.76" x2="66" y2="565.76" stroke="#E2602A" stroke-width="2"/></g>
<text x="80" y="566" class="note"><tspan x="80" dy="0">Edit the spec or an ADR and the grill pass goes stale; change any code and the judge and review passes do.</tspan><tspan x="80" dy="24">Gates re-derive a stored pass from its evidence, so a hand-written pass doesn't count. Verdict history is append-only, and agents can't write it.</tspan></text>
<text x="48" y="660" class="label">CHECKED AGAIN, OUTSIDE THE AGENT'S SESSION</text>
<rect x="48" y="684" width="326" height="216" rx="3" fill="#FAF9F6" stroke="#A9A49B" stroke-width="1.5"/>
<text x="68" y="714" class="tiny">GIT HOOK</text>
<text x="68" y="748" class="title-s"><tspan x="68" dy="0">pre-commit verify</tspan></text>
<text x="68" y="780" class="body"><tspan x="68" dy="0">The staged result: start gate,</tspan><tspan x="68" dy="24">judge and review passes, one</tspan><tspan x="68" dy="24">[WIP], user-only settings,</tspan><tspan x="68" dy="24">harness files.</tspan></text>
<line x1="376" y1="792.0" x2="396" y2="792.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="400" y="684" width="326" height="216" rx="3" fill="#FAF9F6" stroke="#A9A49B" stroke-width="1.5"/>
<text x="420" y="714" class="tiny">GIT HOOK · FULL INSTALL</text>
<text x="420" y="748" class="title-s"><tspan x="420" dy="0">pre-push verify</tspan></text>
<text x="420" y="780" class="body"><tspan x="420" dy="0">Every commit being pushed, by</tspan><tspan x="420" dy="24">the deliverer or anyone else.</tspan></text>
<line x1="728" y1="792.0" x2="748" y2="792.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="752" y="684" width="326" height="216" rx="3" fill="#FAF9F6" stroke="#A9A49B" stroke-width="1.5"/>
<text x="772" y="714" class="tiny">CI · HARNESS-VERIFY</text>
<text x="772" y="748" class="title-s"><tspan x="772" dy="0">The base branch's</tspan><tspan x="772" dy="27">verifier</tspan></text>
<text x="772" y="807" class="body"><tspan x="772" dy="0">verify --range with the base</tspan><tspan x="772" dy="24">branch's engine, so a PR can't</tspan><tspan x="772" dy="24">weaken the check that gates it.</tspan></text>
<line x1="1080" y1="792.0" x2="1100" y2="792.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1104" y="684" width="326" height="216" rx="3" fill="#FAF9F6" stroke="#A9A49B" stroke-width="1.5"/>
<text x="1124" y="714" class="tiny">CI · HARNESS-JUDGE · OPTIONAL</text>
<text x="1124" y="748" class="title-s"><tspan x="1124" dy="0">An independent judge</tspan></text>
<text x="1124" y="780" class="body"><tspan x="1124" dy="0">A fresh judge session re-judges</tspan><tspan x="1124" dy="24">each task the PR finishes and</tspan><tspan x="1124" dy="24">re-runs the tests.</tspan></text>
<line x1="1432" y1="792.0" x2="1458" y2="792.0" stroke="#46443F" stroke-width="1.6" marker-end="url(#arrow)"/>
<g><path d="M1482,775.0 L1499,792.0 L1482,809.0 L1465,792.0 z" fill="#FAF9F6" stroke="#262523" stroke-width="1.8"/><path d="M1482,786.0 L1488,792.0 L1482,798.0 L1476,792.0 z" fill="#E2602A"/></g>
<text x="1512" y="784.0" class="title-s">A person</text>
<text x="1512" y="812.0" class="title-s">merges</text>
<text x="1460" y="848.0" class="tiny">HARNESS EDITS NEED THE</text>
<text x="1460" y="868.0" class="tiny">HARNESS-CHANGE-APPROVED</text>
<text x="1460" y="888.0" class="tiny">LABEL</text>
<text x="48" y="980" class="label">PROPOSED · EACH ADR SHIPS A V1 SLICE; NONE IS ACCEPTED YET</text>
<rect x="48" y="1004" width="540" height="178" rx="3" fill="#FAF9F6" stroke="#E2602A" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="68" y="1034" class="tiny" fill="#E2602A">ADR-003 · IN THE JUDGE PASS AND RECEIPT</text>
<text x="68" y="1066" class="title-s">Sandbox evidence</text>
<text x="68" y="1096" class="body"><tspan x="68" dy="0">Each judge pass records where it ran: backend, isolation</tspan><tspan x="68" dy="23">class, image digest, egress allowlist hash, region,</tspan><tspan x="68" dy="23">control plane, credential mode.</tspan></text>
<rect x="612" y="1004" width="540" height="178" rx="3" fill="#FAF9F6" stroke="#E2602A" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="632" y="1034" class="tiny" fill="#E2602A">ADR-004 · READ FROM BACKBONE/ AND GIT</text>
<text x="632" y="1066" class="title-s">Traceability export</text>
<text x="632" y="1096" class="body"><tspan x="632" dy="0">trace export --format reqif | needs | html: requirement →</tspan><tspan x="632" dy="23">AC → test → verdict → commit. Derived and one-way; never</tspan><tspan x="632" dy="23">committed.</tspan></text>
<rect x="1176" y="1004" width="540" height="178" rx="3" fill="#FAF9F6" stroke="#E2602A" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="1196" y="1034" class="tiny" fill="#E2602A">ADR-005 · IN HARNESS-VERIFY</text>
<text x="1196" y="1066" class="title-s">Signed verdict attestation</text>
<text x="1196" y="1096" class="body"><tspan x="1196" dy="0">attest --range: an in-toto statement about the head commit</tspan><tspan x="1196" dy="23">and code tree, only for a range that verifies. CI signs it</tspan><tspan x="1196" dy="23">with cosign when a key is set.</tspan></text>
<g><rect x="48" y="1215" width="18" height="34" rx="2" fill="#FAF9F6" stroke="#8C8880" stroke-width="1.5"/><line x1="48" y1="1227.24" x2="66" y2="1227.24" stroke="#E2602A" stroke-width="2"/><line x1="48" y1="1236.76" x2="66" y2="1236.76" stroke="#E2602A" stroke-width="2"/></g>
<text x="78" y="1238" class="tiny">CHECKED BY THE HARNESS</text>
<g><path d="M372,1219 L385,1232 L372,1245 L359,1232 z" fill="#FAF9F6" stroke="#262523" stroke-width="1.8"/><path d="M372,1226 L378,1232 L372,1238 L366,1232 z" fill="#E2602A"/></g>
<text x="394" y="1238" class="tiny">A PERSON DECIDES</text>
<rect x="640" y="1218" width="40" height="26" rx="3" fill="#FAF9F6" stroke="#E2602A" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="694" y="1238" class="tiny">PROPOSED: AN ADR AND ITS V1 SLICE, NOT YET ACCEPTED</text>
</svg>
