<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1150" width="1700" height="1150" role="img" aria-labelledby="t d">
<title id="t">Who decides, by Change-Class</title>
<desc id="d">For each Change-Class (docs, refactor, feature, schema): whether the light lane applies, who approves the spec in supervised and autonomous mode, which risk label the receipt suggests, and who merges. A person approves every spec in supervised mode and merges every pull request.</desc>
