<text x="48" y="84" class="h1">Who decides, by Change-Class</text>
<text x="1652" y="80" class="tiny" text-anchor="end">ADR-002 · ENFORCED IN RISK, APPROVE AND THE LIGHT LANE</text>
<line x1="40" y1="112" x2="1660" y2="112" stroke="#CFCBC3" stroke-width="1.5"/>
<text x="78" y="160" class="label">CHANGE-CLASS</text>
<text x="78" y="186" class="tiny">DECLARED IN THE SPEC</text>
<text x="372" y="160" class="label">LIGHT LANE</text>
<text x="372" y="186" class="tiny">IF THE USER SWITCHED IT ON</text>
<text x="654" y="160" class="label">SUPERVISED</text>
<text x="654" y="186" class="tiny">SPEC APPROVAL · DEFAULT</text>
<text x="914" y="160" class="label">AUTONOMOUS</text>
<text x="914" y="186" class="tiny">SPEC APPROVAL · OPT-IN</text>
<text x="1208" y="160" class="label">RECEIPT LABEL</text>
<text x="1208" y="186" class="tiny">WITHOUT → WITH OTHER RISKS</text>
<text x="1492" y="160" class="label">PR MERGE</text>
<text x="1492" y="186" class="tiny">EVERY CLASS</text>
<line x1="48" y1="220" x2="48" y2="762" stroke="#8C8880" stroke-width="1.6" marker-end="url(#arrow-g)"/>
<text x="38" y="491.0" class="tiny" text-anchor="middle" transform="rotate(-90 38 491.0)">MORE ASSURANCE</text>
<rect x="68" y="214" width="1402" height="128" rx="3" fill="#FAF9F6" stroke="#CFCBC3" stroke-width="1.5"/>
<text x="92" y="262" style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 26px; fill: #262523;">docs</text>
<text x="92" y="294" class="note"><tspan x="92" dy="0">Markdown and other doc files;</tspan><tspan x="92" dy="21">code comments count as code</tspan></text>
<g><rect x="380" y="261.0" width="18" height="34" rx="2" fill="#FAF9F6" stroke="#8C8880" stroke-width="1.5"/><line x1="380" y1="273.24" x2="398" y2="273.24" stroke="#E2602A" stroke-width="2"/><line x1="380" y1="282.76" x2="398" y2="282.76" stroke="#E2602A" stroke-width="2"/></g>
<text x="420" y="260.0" class="item"><tspan x="420" dy="0">With the user's</tspan><tspan x="420" dy="24">(light) mark, if the</tspan><tspan x="420" dy="24">rules pass</tspan></text>
<g><rect x="922" y="261.0" width="18" height="34" rx="2" fill="#FAF9F6" stroke="#8C8880" stroke-width="1.5"/><line x1="922" y1="273.24" x2="940" y2="273.24" stroke="#E2602A" stroke-width="2"/><line x1="922" y1="282.76" x2="940" y2="282.76" stroke="#E2602A" stroke-width="2"/></g>
<text x="962" y="272.0" class="item"><tspan x="962" dy="0">Policy approves when</tspan><tspan x="962" dy="24">nothing is risky</tspan></text>
