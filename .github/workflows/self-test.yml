# Runs the harness self-test on every pull request and push to main, so a
# regression in the payload is caught here before any project installs it.
name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    # The suite takes about 10 minutes on macOS; this bounds the intermittent stall and leaves room for a slow runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the test-only tools
        run: python -m pip install -r tests/requirements.txt
      - name: Run the self-test
        run: tests/run-tests.sh
        env:
          # Properties that start a process per example run a quarter of their examples; nightly.yml runs them all.
          HYPOTHESIS_PROFILE: ci
